plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
    id 'signing'
}

/**
 * Retrieves a project property safely using the Gradle 9.0 compatible Providers API.
 * Replaces deprecated project.hasProperty() and project.getProperty().
 */
def getSafeProperty(propName, defaultValue) {
    return providers.gradleProperty(propName).getOrElse(defaultValue)
}

/**
 * Shared validation logic that can be applied to any task.
 * Returns true if binaries are found, false otherwise.
 */
def hasNativeBinaries() {
    def jniPathStr = getSafeProperty('FFMPEG_KIT_JNI_LIBS_DIR', "../../prebuilt/android/jniLibs-base/jniLibs")
    def jniDir = file(jniPathStr)
    def archesStr = getSafeProperty('FFMPEG_KIT_ARCHES', 'arm64-v8a,armeabi-v7a,x86_64')
    def expectedArches = archesStr.split(',').collect { it.trim() }

    return expectedArches.any { arch ->
        def archDir = new File(jniDir, arch)
        archDir.exists() && archDir.listFiles()?.any { file -> 
            file.name.endsWith('.so') || file.name.endsWith('.a') 
        }
    }
}

base {
    archivesName = getSafeProperty('FFMPEG_KIT_OUTPUT_NAME', "bundle")
}

android {
    namespace = getSafeProperty('FFMPEG_KIT_NAMESPACE', 'io.github.akashskypatel.ffmpegkit')
    compileSdk = 33
    
    ndkVersion = getSafeProperty('ANDROID_NDK', "29.0.14206865")

    defaultConfig {
        minSdk = getSafeProperty('ANDROID_API_LEVEL', "26").toInteger()
        targetSdk = 33
     
        versionCode = getSafeProperty('FFMPEG_KIT_VERSION_CODE', "1").toInteger()
        versionName = getSafeProperty('FFMPEG_KIT_VERSION', "1.0.0")
        
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            def jniPathStr = getSafeProperty('FFMPEG_KIT_JNI_LIBS_DIR', "../../prebuilt/android/jniLibs-base/jniLibs")
            def jniDir = file(jniPathStr)

            println("--> Resolved JNI Directory: ${jniDir.absolutePath}")
            println("--> Directory Exists: ${jniDir.exists()}")

            jniLibs.srcDirs = [jniDir]
        }
    }
}

/**
 * Global skip logic.
 * If binaries are missing, we skip every task related to the build or publication.
 */
def binariesExist = hasNativeBinaries()

if (!binariesExist) {
    println "--> [GLOBAL SKIP] No native binaries found. Neutralizing all build, metadata, and publish tasks."
    
    tasks.configureEach { task ->
        // Specifically target tasks that require the AAR output to exist
        if (task.name.contains("Release") ||
            task.name.contains("Publication") ||
            task.name.contains("bundle") ||
            task.name.contains("Metadata") ||
            task.name == "publishToMavenLocal") {
            
            task.onlyIf { false }
        }
    }
}

signing {
    def signPublications = providers.gradleProperty('FFMPEG_KIT_SIGN_PUBLICATIONS')
        .map { it.toBoolean() }
        .getOrElse(false)
    if (signPublications) {
        useGpgCmd()
    }
}

mavenPublishing {
    def githubUsername = getSafeProperty('GITHUB_USERNAME', 'akashskypatel')
    def githubRepo = getSafeProperty('GITHUB_REPO', 'ffmpeg-kit-builders')
    def signPublications = providers.gradleProperty('FFMPEG_KIT_SIGN_PUBLICATIONS')
        .map { it.toBoolean() }
        .getOrElse(false)

    coordinates(
        getSafeProperty('FFMPEG_KIT_NAMESPACE', 'io.github.akashskypatel.ffmpegkit'),
        getSafeProperty('FFMPEG_KIT_OUTPUT_NAME', 'bundle'),
        getSafeProperty('FFMPEG_KIT_VERSION', '1.0.0')
    )
    publishToMavenCentral(true)
    if (signPublications) {
        signAllPublications()
    }

    pom {
        name = 'FFmpegKit Extended'
        description = 'FFmpeg-Kit Extended is a native library that allows programatic access to executing FFmpeg, FFprobe, and FFplay commands for Android, Windows, and Linux. It provides a simple C and C++ API to execute these commands with callbacks for logs, statistics, session completion, media information parsing and more. The pure C API makes it easy to integrate with any language.'
        url = "https://github.com/${githubUsername}/${githubRepo}"
        
        licenses {
            license {
                name = 'LGPL 3.0 License'
                url = 'https://www.gnu.org/licenses/lgpl-3.0.en.html'
                distribution = 'repo'
            }
        }
        
        developers {
            developer {
                id = githubUsername
                name = githubUsername
                url = "https://github.com/${githubUsername}/${githubRepo}"
            }
        }
        
        scm {
            connection = "scm:git:github.com/${githubUsername}/${githubRepo}.git"
            developerConnection = "scm:git:ssh://github.com/${githubUsername}/${githubRepo}.git"
            url = "https://github.com/${githubUsername}/${githubRepo}/tree/master"
        }
    }
}

dependencies {
    implementation "com.android.support:support-annotations:28.0.0"
    compileOnly "com.android.tools.lint:lint-api:31.1.0"
}
