name: Fix macOS test exports

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/fix_macos_test_exports.yaml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0

      - name: Fix Apple C API exports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('FFmpegKit/CMakeLists.txt')
          text = path.read_text()

          old_comment = '        # Do NOT use broad patterns like:\n        #   _ffmpeg*\n        #   _ffprobe*\n        #   _ffplay*\n        #\n        # _ffmpeg* also matches _ffmpegkit_lzma_* and leaks private-prefixed\n        # dependency symbols into the final dylib ABI.\n'
          new_comment = '        # Export the low-level embedded CLI C APIs as well as the higher-level\n        # ffmpeg-kit C API. Keep the underscore delimiter in these patterns:\n        # _ffmpeg_* matches ffmpeg_init/ffmpeg_run/ffmpeg_kit_* but does not\n        # match private symbols such as _ffmpegkit_lzma_*.\n'
          if text.count(old_comment) != 1:
              raise RuntimeError('Apple export-list comment did not match exactly once')
          text = text.replace(old_comment, new_comment, 1)

          old_exports = '_ffmpeg_kit_*\n_ffprobe_kit_*\n_ffplay_kit_*\n'
          new_exports = '_ffmpeg_*\n_ffprobe_*\n_ffplay_*\n'
          if text.count(old_exports) != 1:
              raise RuntimeError('Apple ffmpeg-kit export prefixes did not match exactly once')
          text = text.replace(old_exports, new_exports, 1)

          path.write_text(text)
          PY

          rm .github/workflows/fix_macos_test_exports.yaml
          git diff --check
          grep -q '^_ffmpeg_\*$' FFmpegKit/CMakeLists.txt
          grep -q '^_ffprobe_\*$' FFmpegKit/CMakeLists.txt
          grep -q '^_ffplay_\*$' FFmpegKit/CMakeLists.txt

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: export embedded CLI APIs on Apple"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
