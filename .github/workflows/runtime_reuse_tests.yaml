name: Runtime reuse tests

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/runtime_reuse_tests.yaml

permissions:
  contents: write
  packages: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  WORKFLOW_FORCE_SELF: ""
  WORKFLOW_BUILD_FROM: ""
  WORKFLOW_BUILD_ONLY: ""
  WORKFLOW_TARGET_PLATFORMS: linux
  WORKFLOW_TARGET_ARCHS: x86_64
  WORKFLOW_BUILD_FFMPEG: "false"
  WORKFLOW_BUILD_BUNDLE: "false"
  WORKFLOW_CURRENT_STEP: ""
  WORKFLOW_SEEN_STEPS: ""
  WORKFLOW_BUNDLES: debug
  WORKFLOW_IS_CI: "false"

jobs:
  test_linux:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/akashskypatel/ffmpeg-kit-builders-dev:latest
      credentials:
        username: akashskypatel
        password: ${{ secrets.GHCR_PAT || github.token }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Prepare scripts
        shell: bash
        run: find scripts FFmpegKit -type f -name "*.sh" -exec chmod +x {} +
      - name: Materialize Linux dependencies and FFmpeg
        shell: bash
        run: sudo -E "${GITHUB_WORKSPACE}/scripts/workflow-runner.sh" --runner-platform=linux
      - name: Build FFmpegKit with tests
        shell: bash
        run: |
          sudo -E ./runner.sh \
            --host=linux \
            --arch=x86_64 \
            --gpl \
            -y \
            --no-bundle \
            --skip \
            --hide-banner \
            --enable-base \
            --enable-debug \
            --build-deps=n \
            --build-ffmpeg-kit-only=shared \
            --build-tests=undefined \
            --force-kit
          test -x FFmpegKit/build/tests/ffmpegkit_tests
      - name: Run embedded runtime reuse regressions
        shell: bash
        run: |
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          cd FFmpegKit/build
          ./tests/ffmpegkit_tests --gtest_filter='EmbeddedCliReuseTest.*'

  cleanup:
    if: ${{ always() }}
    needs: test_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0
      - name: Remove temporary test workflow
        shell: bash
        run: |
          rm .github/workflows/runtime_reuse_tests.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove runtime reuse test workflow"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
