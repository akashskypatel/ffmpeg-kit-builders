name: Harden GitHub credential fallback

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/auth_fallback_patch.yaml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: python3 .github/auth_fallback_patch.py

      - name: Validate scripts
        shell: bash
        run: |
          bash -n scripts/function.sh
          bash -n scripts/workflow-get-deps.sh
          bash -n scripts/upload-deps-release.sh
          git diff --check
          ! grep -q 'gh api user' scripts/function.sh
          grep -q 'github_gh release download' scripts/workflow-get-deps.sh
          grep -q 'github_gh release upload' scripts/upload-deps-release.sh

      - name: Smoke test fallback order
        shell: bash
        run: |
          LOG_FILE="${RUNNER_TEMP}/auth-fallback.log"
          export LOG_FILE
          source scripts/function.sh
          gh() {
            case "${GH_TOKEN:-}" in
              expired) return 1 ;;
              pat) printf 'pat-ok\n'; return 0 ;;
              classic) printf 'classic-ok\n'; return 0 ;;
              *) return 1 ;;
            esac
          }
          GITHUB_TOKEN=expired
          GH_TOKEN=pat
          GH_TOKEN_CLASSIC=classic
          export GITHUB_TOKEN GH_TOKEN GH_TOKEN_CLASSIC
          [[ "$(github_gh api repos/example/repo)" == "pat-ok" ]]
          GH_TOKEN=expired
          export GH_TOKEN
          [[ "$(github_gh api repos/example/repo)" == "classic-ok" ]]
          if authorize_github expired repo example; then
            echo "authorize_github unexpectedly accepted an invalid token" >&2
            exit 1
          fi

      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/auth_fallback_patch.yaml .github/auth_fallback_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/function.sh scripts/workflow-get-deps.sh scripts/upload-deps-release.sh \
            .github/workflows/build_on_linux.yaml .github/workflows/build_on_macos.yaml \
            .github/workflows/auth_fallback_patch.yaml .github/auth_fallback_patch.py
          git diff --cached --check
          git commit -m "fix: harden GitHub credential fallback"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
