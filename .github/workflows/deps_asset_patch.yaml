name: Validate paginated dependency asset fix

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/deps_asset_patch.yaml

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_TOKEN_CLASSIC: ${{ secrets.GH_TOKEN_CLASSIC }}

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: python3 .github/deps_asset_patch.py

      - name: Validate syntax
        shell: bash
        run: |
          bash -n scripts/function.sh
          bash -n scripts/workflow-get-deps.sh
          git diff --check

      - name: Verify fallback stdout isolation
        shell: bash
        run: |
          LOG_FILE="${RUNNER_TEMP}/deps-asset-auth.log"
          export LOG_FILE
          source scripts/function.sh

          gh() {
            case "${GH_TOKEN:-}" in
              expired)
                printf 'failed-attempt-output\n'
                return 1
                ;;
              pat)
                printf 'successful-output\n'
                return 0
                ;;
              classic)
                printf 'classic-output\n'
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          GITHUB_TOKEN=expired
          GH_TOKEN=pat
          GH_TOKEN_CLASSIC=classic
          export GITHUB_TOKEN GH_TOKEN GH_TOKEN_CLASSIC
          [[ "$(github_gh_capture api example)" == "successful-output" ]]

          GH_TOKEN=expired
          export GH_TOKEN
          [[ "$(github_gh_capture api example)" == "classic-output" ]]

      - name: Fetch page-two release assets through workflow script
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          ln -sf "$(command -v sed)" "${RUNNER_TEMP}/bin/gsed"
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          export LOG_FILE="${RUNNER_TEMP}/deps-asset-live.log"
          export WORKFLOW_SEEN_STEPS_FILE="${RUNNER_TEMP}/workflow-seen.log"
          chmod +x scripts/workflow-get-deps.sh

          ./scripts/workflow-get-deps.sh windows x86_64 build_libvvenc --artifact
          test -d prebuilt/windows-x86_64/libvvenc

          ./scripts/workflow-get-deps.sh android x86_64 build_libvvenc --artifact
          test -d prebuilt/android-x86_64/libvvenc

          rm -rf prebuilt/windows-x86_64/libvvenc prebuilt/android-x86_64/libvvenc

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/function.sh scripts/workflow-get-deps.sh
          git diff --cached --check
          git commit -m "fix: fetch paginated dependency release assets"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
