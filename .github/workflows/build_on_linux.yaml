name: build_on_linux

on:
  workflow_dispatch:
    inputs:
      target_platforms:
        description: "Comma-separated target platforms this runner can build"
        required: true
        default: "linux,windows,android"
        type: string
      target_archs:
        description: "Comma-separated target architectures to try for each selected platform"
        required: true
        default: "x86_64,aarch64,armv7a"
        type: string
      force:
        description: "Force rebuild instead of using existing self release artifacts"
        required: false
        default: false
        type: boolean
      build_from:
        description: "Specify step as starting point. Must be build_*"
        required: false
        default: ""
        type: string
      build_only:
        description: "Comma-separated build_* dependency steps to build"
        required: false
        default: ""
        type: string
      bundles:
        description: "Comma-separated target ffmpeg-kit bundles to build"
        required: false
        default: "full,video_hw,video,audio,base,debug"
        type: string
      build_ffmpeg:
        description: "Build ffmpeg binaries"
        required: false
        default: false
        type: boolean
      build_bundle:
        description: "Build ffmpeg-kit binaries and bundle"
        required: false
        default: false
        type: boolean

env:
  GH_TOKEN: ${{ github.token }}
  WORKFLOW_FORCE_SELF: ${{ inputs.force }}
  WORKFLOW_BUILD_FROM: ${{ inputs.build_from }}
  WORKFLOW_BUILD_ONLY: ${{ inputs.build_only }}
  WORKFLOW_TARGET_PLATFORMS: ${{ inputs.target_platforms }}
  WORKFLOW_TARGET_ARCHS: ${{ inputs.target_archs }}
  WORKFLOW_BUILD_FFMPEG: ${{ inputs.build_ffmpeg }}
  WORKFLOW_BUILD_BUNDLE: ${{ inputs.build_bundle }}
  WORKFLOW_CURRENT_STEP: ""
  WORKFLOW_SEEN_STEPS: ""
  WORKFLOW_BUNDLES: ${{ inputs.bundles }}
  OSSRH_BASE64: ${{ secrets.OSSRH_BASE64 }}
  OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
  OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}

permissions:
  contents: write
  packages: read

jobs:
  build_deps:
    name: linux targets
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/akashskypatel/ffmpeg-kit-builders-dev:latest
      credentials:
        username: akashskypatel
        password: ${{ secrets.GHCR_PAT || github.token }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare scripts
        shell: bash
        run: chmod +x runner.sh scripts/*.sh scripts/toolchain/*.sh

      - name: Configure Maven signing
        shell: bash
        run: |
          USER_HOME="${GITHUB_WORKSPACE}"

          if [[ -z "${USER_HOME}" || ! -d "${USER_HOME}" ]]; then
            echo "Unable to determine user home" >&2
            exit 1
          fi

          mkdir -p ${USER_HOME}/.gradle ${USER_HOME}/.gnupg

          echo "${{ secrets.GPG_SECRET_KEYRING_BASE64 }}" | base64 -d |             tee ${USER_HOME}/.gnupg/secring.gpg > /dev/null

          tee ${USER_HOME}/.gradle/gradle.properties > /dev/null <<EOF
          signing.keyId=${{ secrets.GPG_KEY_ID }}
          signing.password=${{ secrets.GPG_PASSWORD }}
          signing.secretKeyRingFile=${USER_HOME}/.gnupg/secring.gpg
          EOF

          chmod 600 ${USER_HOME}/.gnupg/secring.gpg ${USER_HOME}/.gradle/gradle.properties

      - name: Build selected dependencies
        shell: bash
        run: sudo -E "${GITHUB_WORKSPACE}/scripts/workflow-runner.sh" --runner-platform=linux

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ github.workflow }}-${{ env.WORKFLOW_CURRENT_STEP }}-${{ github.job }}-${{ github.run_id }}
          path: |
            build.log
            prebuilt
          if-no-files-found: ignore
