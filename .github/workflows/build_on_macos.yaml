name: build_on_macos

on:
  workflow_dispatch:
    inputs:
      target_platforms:
        description: "Comma-separated target platforms this runner can build"
        required: true
        default: "ios,iphonesimulator,appletvos,appletvsimulator,macos"
        type: string
      target_archs:
        description: "Comma-separated target architectures to try for each selected platform"
        required: true
        default: "aarch64,x86_64"
        type: string
      force:
        description: "Force rebuild instead of using existing self release artifacts"
        required: false
        default: false
        type: boolean
      build_from:
        description: "Specify step as starting point. Must be build_*"
        required: false
        default: ""
        type: string
      build_only:
        description: "Only build the specified step and exit"
        required: false
        default: false
        type: boolean
      bundles:
        description: "Comma-separated target ffmpeg-kit bundles to build"
        required: false
        default: "full,video_hw,video,audio,base,debug"
        type: string
      build_ffmpeg:
        description: "Build ffmpeg binaries"
        required: false
        default: false
        type: boolean
      build_bundle:
        description: "Build ffmpeg-kit binaries and bundle"
        required: false
        default: false
        type: boolean

env:
  GH_TOKEN: ${{ github.token }}
  WORKFLOW_FORCE_SELF: ${{ inputs.force }}
  WORKFLOW_BUILD_FROM: ${{ inputs.build_from }}
  WORKFLOW_BUILD_ONLY: ${{ inputs.build_only }}
  WORKFLOW_TARGET_PLATFORMS: ${{ inputs.target_platforms }}
  WORKFLOW_TARGET_ARCHS: ${{ inputs.target_archs }}
  WORKFLOW_BUILD_FFMPEG: ${{ inputs.build_ffmpeg }}
  WORKFLOW_BUILD_BUNDLE: ${{ inputs.build_bundle }}
  WORKFLOW_CURRENT_STEP: ""
  WORKFLOW_SEEN_STEPS: ""
  WORKFLOW_BUNDLES: ${{ inputs.bundles }}

permissions:
  contents: write
  packages: read

jobs:
  build_deps:
    name: macos targets
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Prepare scripts
        shell: bash
        run: chmod +x runner.sh scripts/*.sh scripts/toolchain/*.sh FFmpegKit/scripts/*.sh

      - name: Install Bash
        shell: bash
        run: ${GITHUB_WORKSPACE}/scripts/toolchain/setup-macos-tools.sh

      - name: Cache Apple Rust toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: apple-rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target_platforms }}-${{ inputs.target_archs }}-${{ hashFiles('scripts/toolchain/setup-apple-rust.sh') }}
          restore-keys: |
            apple-rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target_platforms }}-
            apple-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Accept Xcode license
        shell: bash
        run: sudo xcodebuild -license accept

      - name: Build selected dependencies
        shell: bash
        run: sudo -E "$HOMEBREW_BASH" "${GITHUB_WORKSPACE}/scripts/workflow-macos.sh"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ github.workflow }}-${{ env.WORKFLOW_CURRENT_STEP }}-${{ github.job }}-${{ github.run_id }}
          path: |
            build.log
            prebuilt
          if-no-files-found: ignore
