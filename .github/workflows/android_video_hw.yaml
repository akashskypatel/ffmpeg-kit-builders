name: android_video_hw

# Builds an LGPL small video_hw AAR for arm64-v8a and armeabi-v7a. The ABI
# builds run as separate GitHub jobs to reduce peak disk usage and keep each
# build under the hosted-runner time limit. x86 and x86_64 are excluded.

on:
  workflow_dispatch:
    inputs:
      builder_image_digest:
        description: "sha256 digest emitted by the builder_image workflow"
        required: true
        type: string
      runner_label:
        description: "GitHub runner label; select a larger runner if standard disk is insufficient"
        required: true
        default: "ubuntu-24.04"
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: android-video-hw
  cancel-in-progress: false

jobs:
  build_abi:
    name: Build video_hw ${{ matrix.abi }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            kit_dir: ffmpeg-kit-video_hw-android-aarch64-shared-small
          - arch: armv7a
            abi: armeabi-v7a
            kit_dir: ffmpeg-kit-video_hw-android-armv7a-shared-small
    container:
      image: ghcr.io/${{ github.repository_owner }}/ffmpeg-kit-builders-dev@${{ inputs.builder_image_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Checkout dispatched source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight workflow runtime
        shell: bash
        run: |
          (( BASH_VERSINFO[0] >= 4 )) || {
            echo "::error::GNU Bash 4 or newer is required"
            exit 1
          }
          required_commands=(awk git glslangValidator grep install sed sha256sum sort tar tee unzip)
          for required_command in "${required_commands[@]}"; do
            command -v "$required_command" >/dev/null || {
              echo "::error::Required command is unavailable: ${required_command}"
              exit 1
            }
          done
          source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA" || {
            echo "::error::Checked-out source ${source_sha} does not match ${GITHUB_SHA}"
            exit 1
          }
          test -n "${GITHUB_ENV:-}"
          test -n "${GITHUB_STEP_SUMMARY:-}"
          printf 'CHECKED_OUT_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          : >> "$GITHUB_STEP_SUMMARY"

      - name: Report runner capacity
        shell: bash
        run: df -h "$GITHUB_WORKSPACE"

      - name: Prepare build scripts
        shell: bash
        run: find scripts FFmpegKit -type f -name "*.sh" -exec chmod +x {} + && chmod +x runner.sh

      - name: Configure Android toolchain
        shell: bash
        run: |
          sudo -E ./scripts/toolchain/setup-android.sh
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/rust.sh
          rustc --version
          cargo --version

      - name: Build dependencies, FFmpeg and FFmpegKit
        shell: bash
        run: |
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/rust.sh
          disabled_libraries=(
            --disable-openssl
            --disable-libsrt
            --disable-librist
            --disable-librtmp
            --disable-libgsm
            --disable-libmodplug
            --disable-libopenmpt
            --disable-libopencore-amrwb
            --disable-libsoxr
            --disable-libspeex
            --disable-libtwolame
            --disable-openal
            --disable-libaom
            --disable-libaribcaption
            --disable-libass
            --disable-libcaca
            --disable-libfontconfig
            --disable-libfreetype
            --disable-libfribidi
            --disable-libharfbuzz
            --disable-libjxl
            --disable-libkvazaar
            --disable-liboapv
            --disable-libopenjpeg
            --disable-libopencolorio
            --disable-librav1e
            --disable-librsvg
            --disable-libsnappy
            --disable-libsvtav1
            --disable-libvvenc
            --disable-libxeve
            --disable-libxml2
            --disable-libzimg
            --disable-libzvbi
          )
          sudo -E ./runner.sh \
            --host=android \
            --arch=${{ matrix.arch }} \
            -y \
            --build-deps \
            --video-hw-bundle \
            "${disabled_libraries[@]}" \
            --ffmpeg -ff --ff-disable-programs \
            --kit -fk \
            --small \
            --no-bundle \
            --release=local \
            --skip \
            --hide-banner

      - name: Verify Vulkan shader toolchain for this ABI
        shell: bash
        run: |
          require_build_file() {
            local pattern="$1"
            local description="$2"
            local match
            match="$(find prebuilt -type f -path "$pattern" -print -quit)"
            if [[ -z "$match" || ! -s "$match" ]]; then
              echo "::error::Missing ${description} (${pattern})"
              exit 1
            fi
            printf '%s: %s\n' "$description" "$match"
          }

          placebo_config="$(find prebuilt -type f \
            -path '*/libraries/include/libplacebo/config.h' -print -quit)"
          test -n "$placebo_config" || {
            echo "::error::Missing installed libplacebo config.h"
            exit 1
          }
          grep -Eq '^#define[[:space:]]+PL_HAVE_SHADERC[[:space:]]+1$' \
            "$placebo_config" || {
              echo "::error::libplacebo was built without shaderc"
              exit 1
            }

          require_build_file '*/libraries/lib/libshaderc_combined.a' 'shaderc archive'
          require_build_file '*/libraries/lib/libglslang.a' 'glslang archive'
          require_build_file '*/libraries/lib/libSPIRV-Tools.a' 'SPIR-V Tools archive'

      - name: Archive ABI packaging input
        shell: bash
        run: |
          kit_dir="prebuilt/android-${{ matrix.arch }}/${{ matrix.kit_dir }}"
          test -d "$kit_dir/include"
          test -d "$kit_dir/lib"
          test -s prebuilt/src/ffmpeg/config.h
          test -s prebuilt/src/ffmpeg/config_components.h
          test -s prebuilt/src/ffmpeg/ffbuild/config.mak
          install -D -m 0644 prebuilt/src/ffmpeg/config.h \
            ffmpeg-configs/${{ matrix.abi }}/config.h
          install -D -m 0644 prebuilt/src/ffmpeg/config_components.h \
            ffmpeg-configs/${{ matrix.abi }}/config_components.h
          install -D -m 0644 prebuilt/src/ffmpeg/ffbuild/config.mak \
            ffmpeg-configs/${{ matrix.abi }}/config.mak
          tar -czf "build-input-${{ matrix.abi }}.tar.gz" \
            "$kit_dir" \
            "ffmpeg-configs/${{ matrix.abi }}"

      - name: Upload ABI packaging input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-kit-video-hw-input-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-input-${{ matrix.abi }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload ABI failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-kit-video-hw-build-failure-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            prebuilt/src/ffmpeg/ffbuild/config.log
            .ffmpeg-kit-build-state/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  aar:
    name: Package and verify video_hw AAR
    needs: build_abi
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/ffmpeg-kit-builders-dev@${{ inputs.builder_image_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Checkout dispatched source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight workflow runtime
        shell: bash
        run: |
          (( BASH_VERSINFO[0] >= 4 )) || {
            echo "::error::GNU Bash 4 or newer is required"
            exit 1
          }
          required_commands=(awk git grep install sed sha256sum sort tar tee unzip)
          for required_command in "${required_commands[@]}"; do
            command -v "$required_command" >/dev/null || {
              echo "::error::Required command is unavailable: ${required_command}"
              exit 1
            }
          done
          source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA" || {
            echo "::error::Checked-out source ${source_sha} does not match ${GITHUB_SHA}"
            exit 1
          }
          test -n "${GITHUB_ENV:-}"
          test -n "${GITHUB_STEP_SUMMARY:-}"
          printf 'CHECKED_OUT_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          : >> "$GITHUB_STEP_SUMMARY"

      - name: Download ABI packaging inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ffmpeg-kit-video-hw-input-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-inputs
          merge-multiple: true

      - name: Restore ABI packaging inputs
        shell: bash
        run: |
          count=0
          for archive in build-inputs/build-input-*.tar.gz; do
            test -f "$archive"
            tar -xzf "$archive"
            count=$((count + 1))
          done
          test "$count" -eq 2

      - name: Prepare packaging scripts
        shell: bash
        run: find scripts FFmpegKit -type f -name "*.sh" -exec chmod +x {} + && chmod +x runner.sh

      - name: Configure Android toolchain
        shell: bash
        run: |
          sudo -E ./scripts/toolchain/setup-android.sh
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/rust.sh
          source /etc/profile.d/sdkman.sh
          gradle --version

      - name: Package LGPL AAR
        shell: bash
        run: |
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/sdkman.sh
          sudo -E ./scripts/android/build_aar.sh \
            --platform=android-aarch64,android-armv7a \
            --bundle=video_hw \
            --license=lgpl \
            --small \
            --create-aar \
            --local \
            --reset

      - name: Verify AAR ABIs
        shell: bash
        run: |
          aar="tools/android/build/outputs/aar/bundle-video_hw-shared-small-lgpl-release.aar"
          test -s "$aar"
          unzip -Z1 "$aar" > aar-entries.txt
          mapfile -t actual_abis < <(
            awk -F/ '$1 == "jni" && $2 != "" && $3 ~ /\.so$/ { print $2 }' aar-entries.txt |
              LC_ALL=C sort -u
          )
          expected_abis=(arm64-v8a armeabi-v7a)
          if [[ "${actual_abis[*]}" != "${expected_abis[*]}" ]]; then
            echo "::error::Unexpected AAR ABI set: ${actual_abis[*]:-(none)}"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a; do
            grep -Eq "^jni/${abi}/libffmpegkit\\.so$" aar-entries.txt || {
              echo "::error::${abi} is missing from the AAR"
              exit 1
            }
          done
          ls -lh "$aar"

      - name: Verify video_hw bundle capabilities in both ABIs
        shell: bash
        run: |
          required_library_features=(
            CONFIG_SDL2
            CONFIG_LIBMP3LAME
            CONFIG_LIBOPUS
            CONFIG_LIBVORBIS
            CONFIG_LIBOPENCORE_AMRNB
            CONFIG_LIBVO_AMRWBENC
            CONFIG_LIBDAV1D
            CONFIG_LCMS2
            CONFIG_LIBPLACEBO
            CONFIG_LIBTHEORA
            CONFIG_LIBVPX
            CONFIG_LIBWEBP
            CONFIG_AMF
            CONFIG_LIBVPL
            CONFIG_MEDIACODEC
            CONFIG_OPENCL
            CONFIG_OPENGL
            CONFIG_VULKAN
          )
          required_component_features=(
            CONFIG_HLS_MUXER
            CONFIG_HLS_DEMUXER
            CONFIG_AAC_ENCODER
            CONFIG_MOV_MUXER
            CONFIG_LIBOPENH264_ENCODER
            CONFIG_H264_MEDIACODEC_ENCODER
            CONFIG_H264_MEDIACODEC_DECODER
            CONFIG_HEVC_MEDIACODEC_DECODER
            CONFIG_LIBPLACEBO_FILTER
            CONFIG_OVERLAY_VULKAN_FILTER
            CONFIG_SCALE_VULKAN_FILTER
            CONFIG_XFADE_VULKAN_FILTER
          )
          disabled_library_features=(
            CONFIG_OPENSSL
            CONFIG_LIBSRT
            CONFIG_LIBRIST
            CONFIG_LIBRTMP
            CONFIG_LIBGSM
            CONFIG_LIBMODPLUG
            CONFIG_LIBOPENMPT
            CONFIG_LIBOPENCORE_AMRWB
            CONFIG_LIBSOXR
            CONFIG_LIBSPEEX
            CONFIG_LIBTWOLAME
            CONFIG_OPENAL
            CONFIG_LIBAOM
            CONFIG_LIBARIBCAPTION
            CONFIG_LIBASS
            CONFIG_LIBCACA
            CONFIG_LIBFONTCONFIG
            CONFIG_LIBFREETYPE
            CONFIG_LIBFRIBIDI
            CONFIG_LIBHARFBUZZ
            CONFIG_LIBJXL
            CONFIG_LIBKVAZAAR
            CONFIG_LIBOAPV
            CONFIG_LIBOPENJPEG
            CONFIG_LIBOPENCOLORIO
            CONFIG_LIBRAV1E
            CONFIG_LIBRSVG
            CONFIG_LIBSNAPPY
            CONFIG_LIBSVTAV1
            CONFIG_LIBVVENC
            CONFIG_LIBXEVE
            CONFIG_LIBXML2
            CONFIG_LIBZIMG
            CONFIG_LIBZVBI
          )
          disabled_component_features=(
            CONFIG_HTTPS_PROTOCOL
          )
          for abi in arm64-v8a armeabi-v7a; do
            library_header="ffmpeg-configs/${abi}/config.h"
            component_header="ffmpeg-configs/${abi}/config_components.h"
            test -s "$library_header"
            test -s "$component_header"
            grep -qx '#define CONFIG_SMALL 1' "$library_header"
            grep -qx '#define CONFIG_GPL 0' "$library_header"
            grep -qx '#define CONFIG_NONFREE 0' "$library_header"
            for feature in "${required_library_features[@]}"; do
              grep -qx "#define ${feature} 1" "$library_header" || {
                echo "::error::${feature} is not enabled for ${abi}"
                exit 1
              }
            done
            for feature in "${required_component_features[@]}"; do
              grep -qx "#define ${feature} 1" "$component_header" || {
                echo "::error::${feature} is not enabled for ${abi}"
                exit 1
              }
            done
            for feature in "${disabled_library_features[@]}"; do
              grep -qx "#define ${feature} 0" "$library_header" || {
                echo "::error::${feature} is unexpectedly enabled for ${abi}"
                exit 1
              }
            done
            for feature in "${disabled_component_features[@]}"; do
              grep -qx "#define ${feature} 0" "$component_header" || {
                echo "::error::${feature} is unexpectedly enabled for ${abi}"
                exit 1
              }
            done
          done

      - name: Record artifact provenance
        env:
          BUILDER_IMAGE_DIGEST: ${{ inputs.builder_image_digest }}
        shell: bash
        run: |
          aar="tools/android/build/outputs/aar/bundle-video_hw-shared-small-lgpl-release.aar"
          sha256sum "$aar" | tee aar-sha256.txt
          source_sha="$CHECKED_OUT_SOURCE_SHA"
          test -n "$source_sha"
          builder_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/ffmpeg-kit-builders-dev@${BUILDER_IMAGE_DIGEST}"
          {
            echo "source_sha=${source_sha}"
            echo "builder_image=${builder_image}"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "bundle=video_hw"
            echo "license=lgpl"
            echo "small=true"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
          } | tee build-provenance.txt
          {
            echo '### Android video_hw AAR'
            echo
            echo '```text'
            sed "s|tools/android/build/outputs/aar/||" aar-sha256.txt
            echo '```'
            echo
            echo "Builder source: \`${source_sha}\`"
            echo "Builder image: \`${builder_image}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-kit-video-hw-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/android/build/outputs/aar/bundle-video_hw-shared-small-lgpl-release.aar
            aar-sha256.txt
            aar-entries.txt
            build-provenance.txt
            ffmpeg-configs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload packaging failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-kit-video-hw-package-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            tools/android/build/outputs/aar/*.aar
            aar-sha256.txt
            aar-entries.txt
            build-provenance.txt
            .ffmpeg-kit-build-aar-state/
            ffmpeg-configs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
