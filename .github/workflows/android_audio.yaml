name: android_audio

# Builds an LGPL small audio AAR for arm64-v8a and armeabi-v7a. The ABI builds
# run as separate GitHub jobs to reduce peak disk usage and keep each build under
# the hosted-runner time limit. x86 and x86_64 are intentionally excluded.

on:
  workflow_dispatch:
    inputs:
      builder_image_digest:
        description: "sha256 digest emitted by the builder_image workflow"
        required: true
        type: string
      runner_label:
        description: "GitHub runner label; select a larger runner if standard disk is insufficient"
        required: true
        default: "ubuntu-24.04"
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: android-audio
  cancel-in-progress: false

jobs:
  build_abi:
    name: Build audio ${{ matrix.abi }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            kit_dir: ffmpeg-kit-audio-android-aarch64-shared-small
          - arch: armv7a
            abi: armeabi-v7a
            kit_dir: ffmpeg-kit-audio-android-armv7a-shared-small
    container:
      image: ghcr.io/${{ github.repository_owner }}/ffmpeg-kit-builders-dev@${{ inputs.builder_image_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Checkout dispatched source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Report runner capacity
        shell: bash
        run: df -h "$GITHUB_WORKSPACE"

      - name: Prepare build scripts
        shell: bash
        run: find scripts FFmpegKit -type f -name "*.sh" -exec chmod +x {} + && chmod +x runner.sh

      - name: Configure Android toolchain
        shell: bash
        run: |
          sudo -E ./scripts/toolchain/setup-android.sh
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/rust.sh
          rustc --version
          cargo --version

      - name: Build dependencies, FFmpeg and FFmpegKit
        shell: bash
        run: |
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/rust.sh
          disabled_libraries=(
            --disable-openssl
            --disable-libsrt
            --disable-librist
            --disable-librtmp
            --disable-sdl2
            --disable-libgsm
            --disable-libmodplug
            --disable-libopenmpt
            --disable-libopencore-amrwb
            --disable-libsoxr
            --disable-libspeex
            --disable-libtwolame
            --disable-openal
          )
          sudo -E ./runner.sh \
            --host=android \
            --arch=${{ matrix.arch }} \
            -y \
            --build-deps \
            --audio-bundle \
            "${disabled_libraries[@]}" \
            --ffmpeg -ff --ff-disable-programs \
            --kit -fk \
            --small \
            --no-bundle \
            --release=local \
            --skip \
            --hide-banner

      - name: Archive ABI packaging input
        shell: bash
        run: |
          kit_dir="prebuilt/android-${{ matrix.arch }}/${{ matrix.kit_dir }}"
          test -d "$kit_dir/include"
          test -d "$kit_dir/lib"
          test -s prebuilt/src/ffmpeg/config.h
          test -s prebuilt/src/ffmpeg/ffbuild/config.mak
          install -D -m 0644 prebuilt/src/ffmpeg/config.h \
            ffmpeg-configs/${{ matrix.abi }}/config.h
          install -D -m 0644 prebuilt/src/ffmpeg/ffbuild/config.mak \
            ffmpeg-configs/${{ matrix.abi }}/config.mak
          tar -czf "build-input-${{ matrix.abi }}.tar.gz" \
            "$kit_dir" \
            "ffmpeg-configs/${{ matrix.abi }}"

      - name: Upload ABI packaging input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-kit-audio-input-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-input-${{ matrix.abi }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload ABI failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-kit-audio-build-failure-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            prebuilt/src/ffmpeg/ffbuild/config.log
            .ffmpeg-kit-build-state/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  aar:
    name: Package and verify audio AAR
    needs: build_abi
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/ffmpeg-kit-builders-dev@${{ inputs.builder_image_digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Checkout dispatched source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download ABI packaging inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ffmpeg-kit-audio-input-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-inputs
          merge-multiple: true

      - name: Restore ABI packaging inputs
        shell: bash
        run: |
          count=0
          for archive in build-inputs/build-input-*.tar.gz; do
            test -f "$archive"
            tar -xzf "$archive"
            count=$((count + 1))
          done
          test "$count" -eq 2

      - name: Prepare packaging scripts
        shell: bash
        run: find scripts FFmpegKit -type f -name "*.sh" -exec chmod +x {} + && chmod +x runner.sh

      - name: Configure Android toolchain
        shell: bash
        run: |
          sudo -E ./scripts/toolchain/setup-android.sh
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/rust.sh
          source /etc/profile.d/sdkman.sh
          gradle --version

      - name: Package LGPL AAR
        shell: bash
        run: |
          source /etc/profile.d/android-sdk.sh
          source /etc/profile.d/sdkman.sh
          sudo -E ./scripts/android/build_aar.sh \
            --platform=android-aarch64,android-armv7a \
            --bundle=audio \
            --license=lgpl \
            --small \
            --create-aar \
            --local \
            --reset

      - name: Verify AAR ABIs
        shell: bash
        run: |
          aar="tools/android/build/outputs/aar/bundle-audio-shared-small-lgpl-release.aar"
          test -s "$aar"
          unzip -Z1 "$aar" > aar-entries.txt
          mapfile -t actual_abis < <(
            awk -F/ '$1 == "jni" && $2 != "" && $3 ~ /\.so$/ { print $2 }' aar-entries.txt |
              LC_ALL=C sort -u
          )
          expected_abis=(arm64-v8a armeabi-v7a)
          if [[ "${actual_abis[*]}" != "${expected_abis[*]}" ]]; then
            echo "::error::Unexpected AAR ABI set: ${actual_abis[*]:-(none)}"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a; do
            grep -Eq "^jni/${abi}/libffmpegkit\\.so$" aar-entries.txt || {
              echo "::error::${abi} is missing from the AAR"
              exit 1
            }
          done
          ls -lh "$aar"

      - name: Verify audio bundle capabilities in both ABIs
        shell: bash
        run: |
          required_features=(
            CONFIG_HLS_MUXER
            CONFIG_HLS_DEMUXER
            CONFIG_AAC_ENCODER
            CONFIG_MOV_MUXER
            CONFIG_LIBMP3LAME
            CONFIG_LIBMP3LAME_ENCODER
            CONFIG_LIBOPUS
            CONFIG_LIBVORBIS
            CONFIG_LIBOPENCORE_AMRNB
            CONFIG_LIBVO_AMRWBENC
          )
          disabled_features=(
            CONFIG_HTTPS_PROTOCOL
            CONFIG_OPENSSL
            CONFIG_LIBSRT
            CONFIG_LIBRIST
            CONFIG_LIBRTMP
            CONFIG_SDL2
            CONFIG_LIBGSM
            CONFIG_LIBMODPLUG
            CONFIG_LIBOPENMPT
            CONFIG_LIBOPENCORE_AMRWB
            CONFIG_LIBSOXR
            CONFIG_LIBSPEEX
            CONFIG_LIBTWOLAME
            CONFIG_OPENAL
          )
          for abi in arm64-v8a armeabi-v7a; do
            header="ffmpeg-configs/${abi}/config.h"
            test -s "$header"
            grep -qx '#define CONFIG_SMALL 1' "$header"
            grep -qx '#define CONFIG_GPL 0' "$header"
            grep -qx '#define CONFIG_NONFREE 0' "$header"
            for feature in "${required_features[@]}"; do
              grep -qx "#define ${feature} 1" "$header" || {
                echo "::error::${feature} is not enabled for ${abi}"
                exit 1
              }
            done
            for feature in "${disabled_features[@]}"; do
              grep -qx "#define ${feature} 0" "$header" || {
                echo "::error::${feature} is unexpectedly enabled for ${abi}"
                exit 1
              }
            done
          done

      - name: Record artifact provenance
        env:
          BUILDER_IMAGE_DIGEST: ${{ inputs.builder_image_digest }}
        shell: bash
        run: |
          aar="tools/android/build/outputs/aar/bundle-audio-shared-small-lgpl-release.aar"
          shasum -a 256 "$aar" | tee aar-sha256.txt
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          builder_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/ffmpeg-kit-builders-dev@${BUILDER_IMAGE_DIGEST}"
          {
            echo "source_sha=${source_sha}"
            echo "builder_image=${builder_image}"
            echo "abis=arm64-v8a,armeabi-v7a"
            echo "bundle=audio"
            echo "license=lgpl"
            echo "small=true"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
          } | tee build-provenance.txt
          {
            echo '### Android audio AAR'
            echo
            echo '```text'
            sed "s|tools/android/build/outputs/aar/||" aar-sha256.txt
            echo '```'
            echo
            echo "Builder source: \`${source_sha}\`"
            echo "Builder image: \`${builder_image}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-kit-audio-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/android/build/outputs/aar/bundle-audio-shared-small-lgpl-release.aar
            aar-sha256.txt
            aar-entries.txt
            build-provenance.txt
            ffmpeg-configs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload packaging failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-kit-audio-package-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            .ffmpeg-kit-build-aar-state/
            ffmpeg-configs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
