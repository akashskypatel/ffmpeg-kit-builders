name: Runtime reuse validation

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/runtime_reuse_validation.yaml

permissions:
  contents: write
  packages: read

jobs:
  build_linux:
    uses: ./.github/workflows/build_on_linux.yaml
    secrets: inherit
    with:
      target_platforms: linux
      target_archs: x86_64
      bundles: debug
      build_bundle: true
      is_ci: false

  cleanup:
    if: ${{ always() }}
    needs: build_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm .github/workflows/runtime_reuse_validation.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove runtime reuse validation workflow"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
