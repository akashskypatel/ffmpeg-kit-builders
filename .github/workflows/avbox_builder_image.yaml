name: avbox_builder_image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: avbox-builder-image
  cancel-in-progress: false

jobs:
  image:
    name: Publish Linux builder image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Fixed branch
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ffmpeg-kit-builders-dev:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
