name: build_all_iphonesimulator

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild instead of using existing self release artifacts"
        required: false
        default: false
        type: boolean
      build_from:
        description: "Start building from specified step instead of starting at the default starting point. Must be build_*"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: iphonesimulator ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [aarch64]
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_FORCE_SELF: ${{ inputs.force }}
      BUILD_FROM: ${{ inputs.build_from }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare scripts
        shell: bash
        run: chmod +x runner.sh scripts/*.sh

      - name: Install Bash
        shell: bash
        run: |
          brew install 'bash' 'coreutils' 'ragel' 'curl' 'pkg-config' 'make' 'git' 'svn' 'gcc' 'autoconf' 'automake' 'yasm' 'cvs' 'flex' 'bison' 'ed' 'pax' 'unzip' 'wget' 'xz' 'nasm' 'gperf' 'autogen' 'bzip2' 'python3' 'bc' 'texinfo' 'glib' 'llvm' 'lld' 'pipx' 'autoconf-archive' 'bc' 'binutils' 'gpatch' 'libtool' 'gsed'
          echo "HOMEBREW_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
      
      - name: Prepare tools
        shell: bash
        run: |
          tool_bin="$(dirname "$HOMEBREW_BASH")"
          ln -sf "$tool_bin/aclocal" "$tool_bin/aclocal-1.18" || true
          ln -sf "$tool_bin/automake" "$tool_bin/automake-1.18" || true

      - name: Accept Xcode license
        shell: bash
        run: sudo xcodebuild -license accept

      - name: Build iphonesimulator dependencies
        shell: bash
        run: |
          set -euo pipefail

          platform="iphonesimulator"
          arch="${{ matrix.arch }}"
          WORKFLOW_BUILD_STEPS="$(sudo -E "$HOMEBREW_BASH" ./runner.sh --host="$platform" --arch="$arch" --enable-full --gpl -y --no-bundle --skip --print-all-steps | awk -F= '/^WORKFLOW_BUILD_STEPS=/{print $2}')"
          echo "WORKFLOW_BUILD_STEPS: $WORKFLOW_BUILD_STEPS"
          start_building=true
          found_build_from=false
          if [[ -n "${BUILD_FROM:-}" ]]; then
            if [[ "$BUILD_FROM" != build_* ]]; then
              echo "build_from must be a build_* step, got: $BUILD_FROM" >&2
              exit 1
            fi
            start_building=false
          fi

          for build in $WORKFLOW_BUILD_STEPS; do
            if [[ -n "${BUILD_FROM:-}" && "$build" == "$BUILD_FROM" ]]; then
              start_building=true
              found_build_from=true
            fi
            if [[ ${start_building} == "true" ]]; then
              echo "Running $build for ${platform}-${arch}"
              sudo -E "$HOMEBREW_BASH" ./runner.sh --host="$platform" --arch="$arch" --enable-full --gpl -y --no-bundle --skip --workflow --build-only="$build"
              sudo rm -rf "${GITHUB_WORKSPACE}/prebuilt/${platform}-${arch}/libraries"
            fi
          done

          if [[ -n "${BUILD_FROM:-}" && "$found_build_from" != "true" ]]; then
            echo "build_from step not found in workflow build steps: $BUILD_FROM" >&2
            exit 1
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ github.workflow }}-${{ github.job }}-${{ matrix.arch }}
          path: |
            build.log
            prebuilt
          if-no-files-found: ignore
