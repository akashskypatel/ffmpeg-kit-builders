name: Apply runtime reuse fix

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/ffmpegkit_runtime_reuse_patch.yaml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0

      - name: Apply FFplay lifecycle and regression changes
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQoKcGF0aCA9IFBhdGgoIkZGbXBlZ0tpdC9zcmMvZmZwbGF5X2xpYi5jIikKdGV4dCA9IHBhdGguYWRfdGV4dCgpCg==' >/dev/null
          cat > /tmp/patch.py.b64 <<'B64'

B64
          base64 -d /tmp/patch.py.b64 > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FFmpegKit/src/ffplay_lib.c FFmpegKit/tests/runtime_reuse_test.cpp FFmpegKit/tests/CMakeLists.txt
          git diff --cached --check
          git commit -m "fix: isolate embedded CLI state between sessions"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
