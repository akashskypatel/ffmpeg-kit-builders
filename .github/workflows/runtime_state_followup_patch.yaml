name: Runtime state follow-up patch

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/runtime_state_followup_patch.yaml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0

      - name: Apply follow-up
        run: echo '' | base64 -d > /tmp/followup.py && python3 /tmp/followup.py

      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FFmpegKit/src/ffmpeg_opt.c FFmpegKit/src/ffmpeg.c FFmpegKit/src/ffmpeg_lib.c FFmpegKit/src/ffprobe_lib.c
          git diff --cached --check
          git commit -m "fix: centralize embedded FFmpeg option reset"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
