name: Runtime state follow-up patch

on:
  push:
    branches:
      - fix/issue-38-ffprobe-argv-timeout
    paths:
      - .github/workflows/runtime_state_followup_patch.yaml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-ffprobe-argv-timeout
          fetch-depth: 0

      - name: Apply runtime lifecycle follow-up
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one regex match, got {count}")
              p.write_text(new_text)

          replace_once(
              "FFmpegKit/src/opt_common.c",
              """    if (report_file_level >= level) {
                  fputs(line, report_file);
                  fflush(report_file);
              }
          """,
              """    if (report_file && report_file_level >= level) {
                  fputs(line, report_file);
                  fflush(report_file);
              }
          """,
          )

          replace_once(
              "FFmpegKit/src/opt_common.c",
              """int opt_report(void *optctx, const char *opt, const char *arg)
          """,
              """void uninit_report(void)
          {
              if (report_file) {
                  fclose(report_file);
                  report_file = NULL;
              }
              report_file_level = AV_LOG_DEBUG;
          }

          int opt_report(void *optctx, const char *opt, const char *arg)
          """,
          )

          replace_once(
              "FFmpegKit/src/opt_common.h",
              """int opt_report(void *optctx, const char *opt, const char *arg);
          int init_report(const char *env, FILE **file);
          """,
              """int opt_report(void *optctx, const char *opt, const char *arg);
          int init_report(const char *env, FILE **file);
          void uninit_report(void);
          """,
          )

          replace_once(
              "FFmpegKit/src/ffmpeg_opt.c",
              """FFMPEG_THREAD_LOCAL OptionDef options[FF_ARRAY_ELEMS(options_template)];

          void ffmpeg_tls_init_options(void) {
          """,
              """FFMPEG_THREAD_LOCAL OptionDef options[FF_ARRAY_ELEMS(options_template)];

          void ffmpeg_reset_options_state(void)
          {
              uninit_opts();
              uninit_report();

              av_freep(&vstats_filename);
              av_freep(&filter_nbthreads);
              av_freep(&print_graphs_file);
              av_freep(&print_graphs_format);

              filter_hw_device = NULL;

              dts_delta_threshold = 10.0f;
              dts_error_threshold = 3600.0f * 30.0f;
              frame_drop_threshold = 0.0f;
              do_benchmark = 0;
              do_benchmark_all = 0;
              do_hex_dump = 0;
              do_pkt_dump = 0;
              copy_ts = 0;
              start_at_zero = 0;
              copy_tb = -1;
              debug_ts = 0;
              exit_on_error = 0;
              abort_on_flags = 0;
              print_stats = -1;
              stdin_interaction = 1;
              max_error_rate = 2.0f / 3.0f;
              filter_complex_nbthreads = 0;
              filter_buffered_frames = 0;
              vstats_version = 2;
              print_graphs = 0;
              auto_conversion_filters = 1;
              stats_period = 500000;

              file_overwrite = 0;
              no_file_overwrite = 0;
              ignore_unknown_streams = 0;
              copy_unknown_streams = 0;
              recast_media = 0;
              hide_banner = 0;
          }

          void ffmpeg_tls_init_options(void) {
          """,
          )

          replace_once(
              "FFmpegKit/src/ffmpeg.h",
              """void show_usage(void);

          int check_avoptions_used""",
              """void show_usage(void);
          void ffmpeg_reset_options_state(void);

          int check_avoptions_used""",
          )

          replace_once(
              "FFmpegKit/src/ffmpeg.c",
              """    if (vstats_file) {
                  if (fclose(vstats_file))
                      av_log(NULL, AV_LOG_ERROR,
                             "Error closing vstats file, loss of information possible: %s\\n",
                             av_err2str(AVERROR(errno)));
              }
              av_freep(&vstats_filename);
          """,
              """    if (vstats_file) {
                  if (fclose(vstats_file))
                      av_log(NULL, AV_LOG_ERROR,
                             "Error closing vstats file, loss of information possible: %s\\n",
                             av_err2str(AVERROR(errno)));
                  vstats_file = NULL;
              }
              av_freep(&vstats_filename);
          """,
          )

          replace_once(
              "FFmpegKit/src/ffmpeg.c",
              """    av_freep(&input_files);
              av_freep(&output_files);

              uninit_opts();

              avformat_network_deinit();
          """,
              """    av_freep(&input_files);
              av_freep(&output_files);

              if (progress_avio) {
                  const int close_ret = avio_closep(&progress_avio);
                  if (close_ret < 0)
                      av_log(NULL, AV_LOG_ERROR,
                             "Error closing progress output: %s\\n",
                             av_err2str(close_ret));
              }

              uninit_opts();
              uninit_report();

              avformat_network_deinit();
          """,
          )

          replace_once(
              "FFmpegKit/src/ffmpeg.c",
              """    ffmpeg_reset_internal_state();
              ffmpeg_tls_init_options();
          """,
              """    ffmpeg_reset_internal_state();
              ffmpeg_reset_options_state();
              ffmpeg_tls_init_options();
          """,
          )

          sub_once(
              "FFmpegKit/src/ffmpeg_lib.c",
              r'/\*\n \* Restore the ffmpeg CLI globals.*?\nstatic int split_args',
              'static int split_args',
              flags=re.S,
          )

          replace_once(
              "FFmpegKit/src/ffmpeg_lib.c",
              """  /* Start every embedded invocation from process-start CLI defaults. */
            ffmpeg_reset_cli_state();
            ffmpeg_kit_assert_triggered = 0;
          """,
              """  ffmpeg_kit_assert_triggered = 0;
          """,
          )

          replace_once(
              "FFmpegKit/src/ffmpeg_lib.c",
              """  if (setjmp(assert_jmp)) {
              ffmpeg_kit_assert_jmp_ptr = NULL;
              ffmpeg_unbind_thread_context();
              uninit_opts();
              av_log(NULL, AV_LOG_ERROR,
          """,
              """  if (setjmp(assert_jmp)) {
              ffmpeg_kit_assert_jmp_ptr = NULL;
              ffmpeg_unbind_thread_context();
              ffmpeg_mark_shutdown_incomplete(ctx);
              ffmpeg_mark_runtime_unrecoverable();
              av_log(NULL, AV_LOG_ERROR,
          """,
          )

          replace_once(
              "FFmpegKit/src/ffprobe_lib.c",
              """  ffprobe_reset_internal_state();
            uninit_opts();

            av_freep(&input_filename);
          """,
              """  ffprobe_reset_internal_state();
            uninit_opts();
            uninit_report();

            av_freep(&input_filename);
          """,
          )

          replace_once(
              "FFmpegKit/src/ffprobe_lib.c",
              """  // Clean up FFmpeg
            avformat_network_deinit();

            av_free(ctx);
          """,
              """  // Clean up FFmpeg
            uninit_report();
            avformat_network_deinit();

            av_free(ctx);
          """,
          )

          replace_once(
              "FFmpegKit/src/ffplay_lib.c",
              """static void ffplay_reset_cli_state(void) {
              uninit_opts();

              if (allocated_afilters) {
          """,
              """static void ffplay_reset_cli_state(void) {
              uninit_opts();
              uninit_report();

              if (allocated_afilters) {
          """,
          )

          marker = """TEST(EmbeddedCliReuseTest, FailedInvocationDoesNotPoisonFollowingRuns) {
          """
          p = Path("FFmpegKit/tests/runtime_reuse_test.cpp")
          text = p.read_text()
          if text.count(marker) != 1:
              raise RuntimeError("runtime_reuse_test.cpp: failed to locate insertion point")
          new_test = r"""TEST(EmbeddedCliReuseTest, FFmpegOverwriteFlagsResetAfterFailure) {
            const std::filesystem::path source(TEST_VIDEO_FILE);
            const std::filesystem::path output =
                source.parent_path() / "runtime-reuse-overwrite-output.mp4";
            std::error_code ec;

            std::filesystem::copy_file(
                source, output, std::filesystem::copy_options::overwrite_existing, ec);
            ASSERT_FALSE(ec) << ec.message();

            {
              const std::string command =
                  "ffmpeg -v error -n -i definitely-missing-runtime-reuse.mp4 -f null -";
              FFmpegContext *ctx = ffmpeg_init(command.c_str());
              ASSERT_NE(ctx, nullptr);
              EXPECT_NE(ffmpeg_run(ctx), 0);
              ffmpeg_free(ctx);
            }

            {
              const std::string command =
                  "ffmpeg -v error -y -i " +
                  quoteCompatibilityArgument(source.string()) +
                  " -map 0 -c copy " + quoteCompatibilityArgument(output.string());
              FFmpegContext *ctx = ffmpeg_init(command.c_str());
              ASSERT_NE(ctx, nullptr);
              EXPECT_EQ(ffmpeg_run(ctx), 0);
              ffmpeg_free(ctx);
            }

            std::filesystem::remove(output, ec);
          }

          """
          p.write_text(text.replace(marker, new_test + marker, 1))
          PY

          rm .github/workflows/runtime_state_followup_patch.yaml

          git diff --check
          grep -q "void ffmpeg_reset_options_state" FFmpegKit/src/ffmpeg_opt.c
          grep -q "no_file_overwrite = 0" FFmpegKit/src/ffmpeg_opt.c
          grep -q "uninit_report();" FFmpegKit/src/ffprobe_lib.c
          grep -q "uninit_report();" FFmpegKit/src/ffplay_lib.c
          grep -q "FFmpegOverwriteFlagsResetAfterFailure" FFmpegKit/tests/runtime_reuse_test.cpp

      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: centralize embedded CLI state reset"
          git push origin HEAD:fix/issue-38-ffprobe-argv-timeout
